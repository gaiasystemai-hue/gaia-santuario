<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaia • Assistente IA</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🌿 Gaia</h1>
            <p>Assistente Inteligente & Regeneração</p>
        </header>
        
        <div id="chat-container" class="chat-box">
            <div class="message assistant">
                Olá! Sou a Gaia. Como posso ajudar-te hoje?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Escreve a tua mensagem...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
